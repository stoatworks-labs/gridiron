  <head>

    <title>Gridiron — browser demo | Stoatworks Labs</title>
    <meta name="description" content="Try the Gridiron FFGL source for Resolume in your browser: an animated step-and-repeat sponsor wall built from a folder of logos, with no logo beside a copy of itself, equal airtime for every logo and a seed that fixes the wall. The plugin's own GLSL, ported to WebGL2 unedited, drawing a wall laid out by a JavaScript port of its arrangement and layout. Starts on the demo logo pack; drop in your own. A demo, not the plugin." />
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="./vendor/kit.css" />
    <link rel="canonical" href="https://gridiron-demo.stoatworks-labs.com/" />

  <body>
    <main id="demo">
      <noscript>
        <p>
          This demo runs the plugin's shaders and a port of its layout in your
          browser, so it needs JavaScript and WebGL2. The plugin itself, its
          source and its downloads are on
          <a href="https://github.com/stoatworks-labs/gridiron">its repository</a>.
        </p>
      </noscript>
    </main>

    <script type="module" src="./plugin.js"></script>
    <script
      src="./vendor/support-footer.js"
      defer
      data-app="Gridiron"
      data-repo="https://github.com/stoatworks-labs/gridiron"
      data-note="A browser demo of the plugin's shaders over a port of its layout. Logos you load are read in this page and never leave your machine."
    ></script>
  </body>
